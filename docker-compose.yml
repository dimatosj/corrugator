services:
  app:
    build: .
    restart: unless-stopped
    networks:
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.corrugator.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.corrugator.entrypoints=websecure"
      - "traefik.http.routers.corrugator.tls.certresolver=letsencrypt"
      - "traefik.http.services.corrugator.loadbalancer.server.port=80"

networks:
  traefik-public:
    external: true
