services:
  app:
    build: .
    restart: unless-stopped
    networks:
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.currogator.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.currogator.entrypoints=websecure"
      - "traefik.http.routers.currogator.tls.certresolver=letsencrypt"
      - "traefik.http.services.currogator.loadbalancer.server.port=80"

networks:
  traefik-public:
    external: true
