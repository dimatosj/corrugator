server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # There is no build step, so nothing is content-hashed: every file lives
    # at a permanent URL. With default caching a deploy would go green while
    # browsers kept serving the old document and the old modules it names.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location ~* \.(js|css)$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
